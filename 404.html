<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Page not found — Xclusive Luxury</title>
<meta name="robots" content="noindex, follow" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Manrope:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0E2620;
    --ivory: #F3EFE4;
    --ivory-dim: #C9D4CE;
    --gold: #C6A15B;
    --hairline: rgba(243, 239, 228, 0.16);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--ivory);
    font-family: 'Manrope', sans-serif;
  }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; text-align: center; padding: 24px;
  }
  h1 {
    font-family: 'Fraunces', serif; font-weight: 600;
    font-size: clamp(32px, 6vw, 56px); margin: 0 0 12px;
  }
  p { color: var(--ivory-dim); margin: 0 0 28px; }
  a {
    color: var(--gold); text-decoration: none; border-bottom: 1px solid var(--hairline);
    padding-bottom: 2px; font-size: 14px;
  }
  a:hover, a:focus-visible { border-color: var(--gold); }
</style>
</head>
<body>
  <h1>Page not found</h1>
  <p>This page doesn't exist, or has moved.</p>
  <a href="/">Back to the homepage</a>
</body>
</html>
