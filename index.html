<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500&display=swap" rel="stylesheet" />

<style>
  :root {
    --bg: #0E2620;
    --panel: #133730;
    --ivory: #F3EFE4;
    --ivory-dim: #C9D4CE;
    --gold: #C6A15B;
    --hairline: rgba(243, 239, 228, 0.16);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ivory);
    font-family: 'Manrope', sans-serif;
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    background:
      radial-gradient(ellipse 900px 600px at 50% 8%, rgba(198,161,91,0.07), transparent 60%),
      var(--bg);
  }

  a { color: inherit; }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 32px clamp(20px, 5vw, 56px) 0;
  }

  .mark {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 20px;
    letter-spacing: 0.08em;
    color: var(--gold);
    border: 1px solid var(--hairline);
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .status {
    font-size: 13px;
    color: var(--ivory-dim);
    letter-spacing: 0.02em;
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 24px;
  }

  .wordmark {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(40px, 9vw, 96px);
    letter-spacing: 0.02em;
    line-height: 1.02;
    margin: 0;
    opacity: 0;
    transform: translateY(14px);
    animation: rise 900ms cubic-bezier(0.2, 0.8, 0.2, 1) 120ms forwards;
  }

  .tagline {
    margin: 22px 0 0;
    max-width: 480px;
    font-size: clamp(15px, 2vw, 17px);
    line-height: 1.6;
    color: var(--ivory-dim);
    opacity: 0;
    transform: translateY(14px);
    animation: rise 900ms cubic-bezier(0.2, 0.8, 0.2, 1) 320ms forwards;
  }

  .rule {
    width: 64px;
    height: 1px;
    background: var(--gold);
    margin: 36px 0 0;
    opacity: 0;
    animation: fade 900ms ease 560ms forwards;
  }

  .contact {
    margin: 28px 0 0;
    font-size: 14px;
    opacity: 0;
    animation: fade 900ms ease 700ms forwards;
  }

  .contact a {
    text-decoration: none;
    border-bottom: 1px solid var(--hairline);
    padding-bottom: 2px;
    transition: border-color 200ms ease, color 200ms ease;
  }

  .contact a:hover,
  .contact a:focus-visible {
    color: var(--gold);
    border-color: var(--gold);
  }

  footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 24px clamp(20px, 5vw, 56px) 32px;
    font-size: 12px;
    color: var(--ivory-dim);
    border-top: 1px solid var(--hairline);
    margin-top: 24px;
  }

  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fade {
    to { opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .wordmark, .tagline, .rule, .contact {
      animation: none;
      opacity: 1;
      transform: none;
    }
  }

  :focus-visible {
    outline: 1px solid var(--gold);
    outline-offset: 3px;
  }
</style>
</head>
<body>

<header>
  <div class="mark" aria-hidden="true">XL</div>
  <div class="status">Launching soon</div>
</header>

<main>
  <h1 class="wordmark">Xclusive&nbsp;Luxury</h1>
  <p class="tagline">Something new is on its way.</p>
  <div class="rule" aria-hidden="true"></div>
</main>

<footer>
  <span>© <span id="year"></span> Xclusive Luxury</span>
  <span>South Africa</span>
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();
</script>

</body>
</html>
